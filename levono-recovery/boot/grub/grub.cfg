insmod normal
insmod linux
insmod boot
insmod sleep
set default=0
if sleep --interruptible 3 ; then
set timeout=0
fi
set root="(hd0,1)"
menuentry "SOHO" {
	linux /images/vmlinuz bootmode=recovery console=ttyS0,115200 rw
	initrd /images/initrd
}
menuentry "SOHORecovery" {
	linux /recovery_images/vmlinuz revover rw
	initrd /recovery_images/initrd
}
menuentry "SOHODEPP" {
	linux /images/vmlinuz depp bootmode=recovery console=ttyS0,115200 rw
	initrd /images/initrd
}
menuentry "SOHOFactoryReset" {
	linux /images/vmlinuz reset bootmode=recovery console=ttyS0,115200 rw
	initrd /images/initrd
}
